services:
  web:
    container_name: meerkat-web
    build:
      context: ./src
      dockerfile: ../docker/Dockerfile
    volumes:
      - ./src:/app
    ports:
      - "8000:8000"
    env_file:
      - docker/.env
    depends_on:
      - db
      - redis

  db:
    container_name: meerkat-db
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - docker/.env

  redpanda:
    container_name: meerkat-redpanda
    image: redpandadata/redpanda:v24.3.1
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --schema-registry-addr 0.0.0.0:8081
    ports:
      - "9092:9092"
      - "8081:8081"
    volumes:
      - redpanda_data:/var/redpanda/data

  redpanda-console:
    container_name: meerkat-redpanda-console
    image: redpandadata/console:v2.8.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
    depends_on:
      - redpanda

  redis:
    container_name: meerkat-redis
    image: redis:7-alpine

volumes:
  postgres_data:
  redpanda_data:
