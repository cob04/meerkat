name: meerkat

services:
  web:
    container_name: meerkat-web
    build:
      context: ../
      dockerfile: docker/web/Dockerfile
      target: development
    volumes:
      - ../src:/opt/meerkat/src
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-conf.settings.dev}
      - DEBUG=${DEBUG:-true}
      - POSTGRES_DB=${POSTGRES_DB:-meerkat}
      - POSTGRES_USER=${POSTGRES_USER:-meerkat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-meerkat}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OPENSEARCH_URL=${OPENSEARCH_URL:-http://opensearch:9200}
      - BROKER_BOOTSTRAP_SERVERS=${BROKER_BOOTSTRAP_SERVERS:-redpanda:29092}
    depends_on:
      - db
      - redis

  db:
    container_name: meerkat-db
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres
      -c wal_level=logical
      -c max_wal_senders=4
      -c max_replication_slots=4
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-meerkat}
      - POSTGRES_USER=${POSTGRES_USER:-meerkat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-meerkat}

  redpanda:
    container_name: meerkat-redpanda
    image: redpandadata/redpanda:v24.3.1
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --schema-registry-addr 0.0.0.0:8081
    ports:
      - "9092:9092"
      - "8081:8081"
    volumes:
      - redpanda_data:/var/redpanda/data

  redpanda-console:
    container_name: meerkat-redpanda-console
    image: redpandadata/console:v2.8.2
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKERS=redpanda:29092
    depends_on:
      - redpanda

  connect:
    container_name: meerkat-connect
    image: debezium/connect:3.0.0.Final
    ports:
      - "8083:8083"
    environment:
      - BOOTSTRAP_SERVERS=redpanda:29092
      - GROUP_ID=meerkat-connect
      - CONFIG_STORAGE_TOPIC=_connect_configs
      - OFFSET_STORAGE_TOPIC=_connect_offsets
      - STATUS_STORAGE_TOPIC=_connect_status
    depends_on:
      - redpanda
      - db

  opensearch:
    container_name: meerkat-opensearch
    image: opensearchproject/opensearch:2.18.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  cdc-consumer:
    container_name: meerkat-cdc-consumer
    build:
      context: ../
      dockerfile: docker/web/Dockerfile
      target: development
    command:
      - celery
      - -A
      - conf.celery
      - worker
      - -l
      - info
      - -Q
      - cdc
    volumes:
      - ../src:/opt/meerkat/src
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-conf.settings.dev}
      - DEBUG=${DEBUG:-true}
      - POSTGRES_DB=${POSTGRES_DB:-meerkat}
      - POSTGRES_USER=${POSTGRES_USER:-meerkat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-meerkat}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OPENSEARCH_URL=${OPENSEARCH_URL:-http://opensearch:9200}
      - BROKER_BOOTSTRAP_SERVERS=${BROKER_BOOTSTRAP_SERVERS:-redpanda:29092}
    restart: unless-stopped
    depends_on:
      - redpanda
      - opensearch
      - db
      - redis

  redis:
    container_name: meerkat-redis
    image: redis:7-alpine

  dozzle:
    container_name: meerkat-dozzle
    image: amir20/dozzle:v8.13.7
    ports:
      - "${DOZZLE_PORT:-8088}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOZZLE_FILTER=label=com.docker.compose.project=meerkat

volumes:
  postgres_data:
  redpanda_data:
  opensearch_data:
