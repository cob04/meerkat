[project]
name = "meerkat"
version = "0.1.0"
description = "CDC inventory search system"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.0,<6",
    "celery>=5.4,<6",
    "django-extensions>=3.2,<4",
    "python-decouple>=3.8",
    "confluent-kafka>=2.6,<3",
    "requests>=2.32,<3",
    "opensearch-py>=2.7,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-django>=4.8,<5",
    "black>=25.0,<26",
    "isort>=6.0",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "conf.settings.dev"
python_files = ["tests.py", "test_*.py"]
cache_dir = "/tmp/pytest_cache"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]
