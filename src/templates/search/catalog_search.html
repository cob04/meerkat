{% extends "base.html" %}

{% block title %}Catalog Search - Meerkat{% endblock %}
{% block page_title %}Catalog Search{% endblock %}

{% block content %}
<form hx-get="{% url 'search:catalog-search' %}"
      hx-target="#search-results"
      hx-select="unset"
      hx-swap="innerHTML"
      hx-push-url="true"
      hx-trigger="submit, keyup changed delay:300ms from:input[name=q], change">
  <div class="flex items-end gap-3 mb-4">
    <div class="flex-1">
      <label class="block text-sm font-medium mb-1.5">Search inventory</label>
      <input type="text"
             name="q"
             value="{{ query.q|default:'' }}"
             placeholder="Drug name, brand, batch..."
             autocomplete="off"
             class="flex h-9 w-full rounded-md border border-input bg-background px-3 py-1 text-sm shadow-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring">
    </div>
    <button type="submit"
            class="inline-flex items-center justify-center h-9 px-4 text-sm font-medium rounded-md border border-input bg-background hover:bg-accent hover:text-accent-foreground transition-colors">
      Search
    </button>
  </div>

  <div id="search-results">
    {% if results %}
      {% include "search/_results.html" %}
    {% endif %}
  </div>
</form>
{% endblock %}
